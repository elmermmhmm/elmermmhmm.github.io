<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Job Tracker</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #0f172a;
      color: #e2e8f0;
      min-height: 100vh;
      padding: 2rem 1rem;
    }

    h1 {
      text-align: center;
      font-size: 1.75rem;
      font-weight: 700;
      margin-bottom: 2rem;
      color: #f8fafc;
      letter-spacing: -0.02em;
    }

    .container { max-width: 680px; margin: 0 auto; }

    /* Add form */
    .add-form {
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 12px;
      padding: 1.25rem;
      margin-bottom: 1.5rem;
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
    }

    .add-form input,
    .add-form textarea {
      background: #0f172a;
      border: 1px solid #334155;
      border-radius: 8px;
      color: #e2e8f0;
      font-size: 0.95rem;
      padding: 0.6rem 0.85rem;
      width: 100%;
      outline: none;
      transition: border-color 0.15s;
      font-family: inherit;
    }

    .add-form input:focus,
    .add-form textarea:focus { border-color: #6366f1; }

    .add-form textarea { resize: vertical; min-height: 72px; }

    .add-form input::placeholder,
    .add-form textarea::placeholder { color: #475569; }

    .add-btn {
      background: #6366f1;
      color: #fff;
      border: none;
      border-radius: 8px;
      padding: 0.65rem 1.25rem;
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.15s;
      align-self: flex-end;
    }

    .add-btn:hover { background: #4f46e5; }

    /* Filter bar */
    .filter-bar {
      display: flex;
      gap: 0.5rem;
      margin-bottom: 1.25rem;
    }

    .filter-btn {
      background: #1e293b;
      color: #94a3b8;
      border: 1px solid #334155;
      border-radius: 99px;
      padding: 0.4rem 1rem;
      font-size: 0.85rem;
      cursor: pointer;
      transition: all 0.15s;
    }

    .filter-btn.active,
    .filter-btn:hover { background: #6366f1; color: #fff; border-color: #6366f1; }

    /* Job list */
    #job-list { display: flex; flex-direction: column; gap: 0.75rem; }

    .empty {
      text-align: center;
      color: #475569;
      padding: 3rem 0;
      font-size: 0.95rem;
    }

    /* Job card */
    .job-card {
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 12px;
      padding: 1rem 1.1rem;
      transition: border-color 0.15s;
    }

    .job-card.applied { border-left: 3px solid #22c55e; }
    .job-card.not-applied { border-left: 3px solid #475569; }

    .card-header {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 0.75rem;
    }

    .job-title {
      font-size: 1rem;
      font-weight: 600;
      color: #f1f5f9;
      flex: 1;
    }

    .job-company {
      font-size: 0.85rem;
      color: #94a3b8;
      margin-top: 0.15rem;
    }

    .card-actions { display: flex; gap: 0.5rem; flex-shrink: 0; }

    .apply-toggle {
      font-size: 0.78rem;
      font-weight: 600;
      padding: 0.3rem 0.75rem;
      border-radius: 99px;
      border: none;
      cursor: pointer;
      transition: all 0.15s;
      white-space: nowrap;
    }

    .apply-toggle.applied-state {
      background: #14532d;
      color: #4ade80;
    }

    .apply-toggle.applied-state:hover {
      background: #166534;
    }

    .apply-toggle.not-applied-state {
      background: #1e3a5f;
      color: #93c5fd;
    }

    .apply-toggle.not-applied-state:hover {
      background: #1e40af;
    }

    .delete-btn {
      background: transparent;
      border: 1px solid #334155;
      color: #64748b;
      border-radius: 6px;
      padding: 0.3rem 0.55rem;
      font-size: 0.8rem;
      cursor: pointer;
      transition: all 0.15s;
    }

    .delete-btn:hover { background: #7f1d1d; color: #fca5a5; border-color: #7f1d1d; }

    /* Notes section */
    .notes-toggle {
      background: none;
      border: none;
      color: #64748b;
      font-size: 0.8rem;
      cursor: pointer;
      margin-top: 0.6rem;
      padding: 0;
      transition: color 0.15s;
    }

    .notes-toggle:hover { color: #94a3b8; }

    .notes-area {
      margin-top: 0.6rem;
      display: none;
    }

    .notes-area.open { display: block; }

    .notes-area textarea {
      width: 100%;
      background: #0f172a;
      border: 1px solid #334155;
      border-radius: 8px;
      color: #cbd5e1;
      font-size: 0.88rem;
      padding: 0.6rem 0.75rem;
      resize: vertical;
      min-height: 80px;
      outline: none;
      font-family: inherit;
      transition: border-color 0.15s;
    }

    .notes-area textarea:focus { border-color: #6366f1; }

    .note-text {
      font-size: 0.88rem;
      color: #94a3b8;
      white-space: pre-wrap;
      line-height: 1.5;
    }

    .save-note-btn {
      margin-top: 0.4rem;
      background: #334155;
      color: #e2e8f0;
      border: none;
      border-radius: 6px;
      padding: 0.35rem 0.85rem;
      font-size: 0.82rem;
      cursor: pointer;
      transition: background 0.15s;
    }

    .save-note-btn:hover { background: #475569; }

    .date-added {
      font-size: 0.75rem;
      color: #475569;
      margin-top: 0.5rem;
    }

    /* Avatar */
    .buddy-wrap {
      position: fixed;
      bottom: 1.5rem;
      left: 1.5rem;
      display: flex;
      flex-direction: column;
      align-items: center;
      z-index: 100;
      cursor: pointer;
      user-select: none;
    }

    .buddy-bubble {
      background: #1e293b;
      border: 1px solid #6366f1;
      border-radius: 12px;
      padding: 0.55rem 0.85rem;
      font-size: 0.8rem;
      color: #c7d2fe;
      max-width: 180px;
      text-align: center;
      line-height: 1.4;
      margin-bottom: 0.5rem;
      position: relative;
      box-shadow: 0 0 12px #6366f130;
      opacity: 0;
      transform: translateY(6px);
      transition: opacity 0.3s, transform 0.3s;
      pointer-events: none;
    }

    .buddy-bubble.show {
      opacity: 1;
      transform: translateY(0);
    }

    .buddy-bubble::after {
      content: '';
      position: absolute;
      bottom: -7px;
      left: 50%;
      transform: translateX(-50%);
      border: 7px solid transparent;
      border-top-color: #6366f1;
      border-bottom: 0;
    }

    .buddy-svg {
      width: 56px;
      height: 56px;
      animation: buddy-float 3s ease-in-out infinite;
      filter: drop-shadow(0 4px 8px #6366f155);
    }

    @keyframes buddy-float {
      0%, 100% { transform: translateY(0); }
      50%       { transform: translateY(-6px); }
    }

    .buddy-wrap:hover .buddy-svg {
      animation: buddy-wiggle 0.4s ease-in-out;
    }

    @keyframes buddy-wiggle {
      0%   { transform: rotate(0deg); }
      25%  { transform: rotate(-10deg); }
      75%  { transform: rotate(10deg); }
      100% { transform: rotate(0deg); }
    }
  </style>
</head>
<body>
  <!-- Buddy avatar -->
  <div class="buddy-wrap" onclick="buddySpeak()" title="Click me!">
    <div class="buddy-bubble" id="buddy-bubble"></div>
    <svg class="buddy-svg" viewBox="0 0 56 56" fill="none" xmlns="http://www.w3.org/2000/svg">
      <!-- body -->
      <ellipse cx="28" cy="32" rx="18" ry="17" fill="#6366f1"/>
      <!-- belly -->
      <ellipse cx="28" cy="35" rx="11" ry="9" fill="#818cf8"/>
      <!-- head -->
      <circle cx="28" cy="18" r="14" fill="#6366f1"/>
      <!-- left eye white -->
      <circle cx="23" cy="16" r="5" fill="white"/>
      <!-- right eye white -->
      <circle cx="33" cy="16" r="5" fill="white"/>
      <!-- left pupil -->
      <circle cx="24" cy="17" r="2.5" fill="#1e1b4b" id="pupil-l"/>
      <!-- right pupil -->
      <circle cx="34" cy="17" r="2.5" fill="#1e1b4b" id="pupil-r"/>
      <!-- left eye shine -->
      <circle cx="25" cy="15.5" r="1" fill="white"/>
      <circle cx="35" cy="15.5" r="1" fill="white"/>
      <!-- smile -->
      <path d="M23 22 Q28 27 33 22" stroke="white" stroke-width="1.8" stroke-linecap="round" fill="none"/>
      <!-- left ear -->
      <ellipse cx="14" cy="17" rx="4" ry="5" fill="#818cf8"/>
      <!-- right ear -->
      <ellipse cx="42" cy="17" rx="4" ry="5" fill="#818cf8"/>
      <!-- left arm -->
      <ellipse cx="10" cy="33" rx="4" ry="7" fill="#6366f1" transform="rotate(-15 10 33)"/>
      <!-- right arm -->
      <ellipse cx="46" cy="33" rx="4" ry="7" fill="#6366f1" transform="rotate(15 46 33)"/>
      <!-- left foot -->
      <ellipse cx="21" cy="48" rx="6" ry="4" fill="#4f46e5"/>
      <!-- right foot -->
      <ellipse cx="35" cy="48" rx="6" ry="4" fill="#4f46e5"/>
      <!-- stars on belly -->
      <text x="24" y="38" font-size="8" fill="#c7d2fe" text-anchor="middle">★</text>
      <text x="32" y="38" font-size="8" fill="#c7d2fe" text-anchor="middle">★</text>
    </svg>
  </div>

  <div class="container">
    <h1>Job Tracker</h1>

    <div class="add-form">
      <input type="text" id="input-title" placeholder="Job title (e.g. Frontend Engineer)" />
      <input type="text" id="input-company" placeholder="Company (optional)" />
      <textarea id="input-notes" placeholder="Notes (optional)"></textarea>
      <button class="add-btn" onclick="addJob()">Add Job</button>
    </div>

    <div class="filter-bar">
      <button class="filter-btn active" data-filter="all" onclick="setFilter('all', this)">All</button>
      <button class="filter-btn" data-filter="applied" onclick="setFilter('applied', this)">Applied</button>
      <button class="filter-btn" data-filter="not-applied" onclick="setFilter('not-applied', this)">Not Applied</button>
    </div>

    <div id="job-list"></div>
  </div>

  <script>
    let jobs = JSON.parse(localStorage.getItem('jobs') || '[]');
    let currentFilter = 'all';

    function save() {
      localStorage.setItem('jobs', JSON.stringify(jobs));
    }

    function addJob() {
      const title = document.getElementById('input-title').value.trim();
      if (!title) {
        document.getElementById('input-title').focus();
        return;
      }
      const company = document.getElementById('input-company').value.trim();
      const notes = document.getElementById('input-notes').value.trim();
      jobs.unshift({
        id: Date.now(),
        title,
        company,
        notes,
        applied: false,
        date: new Date().toLocaleDateString()
      });
      save();
      document.getElementById('input-title').value = '';
      document.getElementById('input-company').value = '';
      document.getElementById('input-notes').value = '';
      render();
    }

    function toggleApplied(id) {
      const job = jobs.find(j => j.id === id);
      if (job) { job.applied = !job.applied; save(); render(); }
    }

    function deleteJob(id) {
      jobs = jobs.filter(j => j.id !== id);
      save();
      render();
    }

    function saveNote(id) {
      const ta = document.querySelector(`[data-note-id="${id}"]`);
      if (!ta) return;
      const job = jobs.find(j => j.id === id);
      if (job) { job.notes = ta.value; save(); render(); }
    }

    function setFilter(filter, btn) {
      currentFilter = filter;
      document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      render();
    }

    function toggleNotes(id) {
      const area = document.getElementById(`notes-area-${id}`);
      const btn = document.getElementById(`notes-btn-${id}`);
      if (!area) return;
      const isOpen = area.classList.toggle('open');
      btn.textContent = isOpen ? '▲ Hide notes' : '▼ ' + (jobs.find(j=>j.id===id)?.notes ? 'View / edit notes' : 'Add notes');
    }

    function render() {
      const list = document.getElementById('job-list');
      let filtered = jobs;
      if (currentFilter === 'applied') filtered = jobs.filter(j => j.applied);
      if (currentFilter === 'not-applied') filtered = jobs.filter(j => !j.applied);

      if (filtered.length === 0) {
        list.innerHTML = `<div class="empty">No jobs here yet.</div>`;
        return;
      }

      list.innerHTML = filtered.map(job => {
        const hasNotes = !!job.notes;
        const notesLabel = hasNotes ? '▼ View / edit notes' : '▼ Add notes';
        return `
          <div class="job-card ${job.applied ? 'applied' : 'not-applied'}">
            <div class="card-header">
              <div>
                <div class="job-title">${escHtml(job.title)}</div>
                ${job.company ? `<div class="job-company">${escHtml(job.company)}</div>` : ''}
              </div>
              <div class="card-actions">
                <button
                  class="apply-toggle ${job.applied ? 'applied-state' : 'not-applied-state'}"
                  onclick="toggleApplied(${job.id})"
                >${job.applied ? '✓ Applied' : 'Not Applied'}</button>
                <button class="delete-btn" onclick="deleteJob(${job.id})">✕</button>
              </div>
            </div>
            <button class="notes-toggle" id="notes-btn-${job.id}" onclick="toggleNotes(${job.id})">${notesLabel}</button>
            <div class="notes-area" id="notes-area-${job.id}">
              <textarea data-note-id="${job.id}" placeholder="Add notes...">${escHtml(job.notes || '')}</textarea>
              <button class="save-note-btn" onclick="saveNote(${job.id})">Save note</button>
            </div>
            <div class="date-added">Added ${job.date}</div>
          </div>
        `;
      }).join('');
    }

    function escHtml(str) {
      return str.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
    }

    // Add job on Enter in title field
    document.getElementById('input-title').addEventListener('keydown', e => {
      if (e.key === 'Enter') addJob();
    });

    render();

    // Buddy encouragement
    const phrases = [
      "You've got this! Keep applying! 💪",
      "Every 'no' gets you closer to your 'yes'! ✨",
      "Your dream job is out there waiting for you!",
      "Consistency is key — one app at a time! 🚀",
      "Believe in yourself as much as I believe in you! 🌟",
      "Progress, not perfection. You're doing great!",
      "Landing interviews is a numbers game — keep going! 🎯",
      "Rest if you must, but don't quit! You're so close! 💫",
    ];

    let lastPhraseIdx = -1;
    let bubbleTimer = null;

    function buddySpeak() {
      let idx;
      do { idx = Math.floor(Math.random() * phrases.length); } while (idx === lastPhraseIdx);
      lastPhraseIdx = idx;

      const bubble = document.getElementById('buddy-bubble');
      bubble.textContent = phrases[idx];
      bubble.classList.add('show');

      clearTimeout(bubbleTimer);
      bubbleTimer = setTimeout(() => bubble.classList.remove('show'), 4000);
    }

    // Show a random phrase on load after a short delay, then every 30s
    setTimeout(buddySpeak, 1200);
    setInterval(buddySpeak, 30000);
  </script>
</body>
</html>
